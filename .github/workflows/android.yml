name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip git cmake unzip wget zip

      - name: Accept Android SDK licenses (required before any SDK tools run)
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Accept all Google licenses
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Also accept licenses in common locations
          for dir in \
            "$HOME/.android" \
            "$HOME/Library/Android/sdk" \
            "/usr/local/android-sdk" \
            "/opt/android-sdk"; do
            mkdir -p "$dir"
            touch "$dir/repositories.cfg"
            yes | "$dir/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$dir/tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          done

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 kivy==2.3.0 cython==0.29.37 pexpect==4.9.0
          pip install markitdown[all] beautifulsoup4 mammoth pdfminer.six pdfplumber
          pip install fpdf2 python-docx ebooklib chardet charset-normalizer defusedxml markdownify magika

      - name: Build debug APK
        env:
          # Let Buildozer manage its own SDK/NDK in .buildozer
          # Do NOT set ANDROID_HOME or ANDROID_SDK_ROOT here
          # Buildozer will download its own SDK + NDK
          BUILD_MODE: debug
        run: |
          cd android
          buildozer android debug
        timeout-minutes: 60

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-converter-apk
          path: android/.buildozer/android/platform/build-*/bin/*.apk
          retention-days: 7
