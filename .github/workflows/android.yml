name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip git cmake unzip wget openjdk-17-jdk

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Pre-accept licenses for ALL possible SDK locations Buildozer might use
          for SDK_HOME in \
            "$HOME/.buildozer/android/platform/android-sdk" \
            "$HOME/.android/android-sdk" \
            "$HOME/android-sdk"; do
            mkdir -p "$SDK_HOME"
            touch "$SDK_HOME/repositories.cfg"
            # Write license files
            mkdir -p "$SDK_HOME/licenses"
            echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_HOME/licenses/android-sdk-license"
            echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK_HOME/licenses/android-sdk-license"
            echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK_HOME/licenses/android-sdk-preview-license"
          done

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 kivy==2.3.0 cython==0.29.37 pexpect==4.9.0
          pip install markitdown[all] beautifulsoup4 mammoth pdfminer.six pdfplumber
          pip install fpdf2 python-docx ebooklib chardet charset-normalizer defusedxml markdownify magika

      - name: Build debug APK
        run: |
          cd android
          buildozer android debug
        timeout-minutes: 60

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-converter-apk
          path: android/.buildozer/android/platform/build-*/bin/*.apk
          retention-days: 7
