name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK licenses (pre-installed SDK)
        run: |
          SDK="/usr/local/lib/android/sdk"
          mkdir -p "$SDK/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK/licenses/android-sdk-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK/licenses/android-sdk-preview-license"
          echo -e "\n8933bad161af4178b1185d1a1f5b0d7f5f115065" > "$SDK/licenses/android-googletv-license"
          echo -e "\ne9bac50e877f1d597ebb3b69539050a6d3b3e4e7" > "$SDK/licenses/android-sdk-arm-dbt-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK/licenses/mips-android-sysimage-license"
          echo -e "\n8933bad161af4178b1185d1a1f5b0d7f5f115065" > "$SDK/licenses/android-googlexr-license"

      - name: Install system + Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool libtool-bin autoconf automake autopoint gettext libltdl-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 kivy==2.2.0 cython==0.29.37 pexpect==4.9.0
          pip install markitdown[all] beautifulsoup4 mammoth pdfminer.six pdfplumber
          pip install fpdf2 python-docx ebooklib==0.18 chardet charset-normalizer defusedxml markdownify magika

      - name: Create symlinks for buildozer SDK layout compatibility
        run: |
          SDK="/usr/local/lib/android/sdk"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          rm -rf "$BUILDOZER_SDK"
          mkdir -p "$(dirname "$BUILDOZER_SDK")"
          ln -s "$SDK" "$BUILDOZER_SDK"
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          if [ ! -e "$BUILDOZER_SDK/tools/bin/sdkmanager" ]; then
            ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
          fi

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          # Use official PyPI instead of mirror
          PIP_INDEX_URL: https://pypi.org/simple/
          PIP_TRUSTED_HOST: pypi.org
        run: |
          cd android
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-converter-apk
          path: android/.buildozer/android/platform/build-*/bin/*.apk
          retention-days: 7