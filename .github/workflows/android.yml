name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Android SDK licenses (pre-installed SDK)
        run: |
          SDK="/usr/local/lib/android/sdk"
          mkdir -p "$SDK/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK/licenses/android-sdk-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK/licenses/android-sdk-preview-license"
          echo -e "\n8933bad161af4178b1185d1a1f5b0d7f5f115065" > "$SDK/licenses/android-googletv-license"
          echo -e "\ne9bac50e877f1d597ebb3b69539050a6d3b3e4e7" > "$SDK/licenses/android-sdk-arm-dbt-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK/licenses/mips-android-sysimage-license"
          echo -e "\n8933bad161af4178b1185d1a1f5b0d7f5f115065" > "$SDK/licenses/android-googlexr-license"

      - name: Install system + Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool libtool-bin autoconf automake autopoint gettext libltdl-dev

          # Install buildozer directly from pip (no venv needed for patch)
          pip install --upgrade pip
          pip install buildozer==1.6.0 kivy==2.3.0 cython==0.29.37 pexpect==4.9.0
          pip install markitdown[all] beautifulsoup4 mammoth pdfminer.six pdfplumber
          pip install fpdf2 python-docx ebooklib chardet charset-normalizer defusedxml markdownify magika

      - name: Patch buildozer to support cmdline-tools layout
        run: |
          # Find buildozer directory and patch sdkmanager_path
          python3 << PYEOF
          import buildozer, os, sys

          buildozer_dir = os.path.dirname(buildozer.__file__)
          target = os.path.join(buildozer_dir, 'targets', 'android.py')
          print(f"Patching: {target}")

          if not os.path.exists(target):
              print(f"ERROR: {target} not found!")
              # Try alternate locations
              for p in [
                  '/root/.local/lib/python3.11/site-packages/buildozer/targets/android.py',
                  '/root/.local/lib/python3.12/site-packages/buildozer/targets/android.py',
                  '/opt/hostedtoolcache/Python/3.11.15/x64/lib/python3.11/site-packages/buildozer/targets/android.py',
              ]:
                  if os.path.exists(p):
                      target = p
                      print(f"Found alternate: {target}")
                      break
              else:
                  sys.exit(1)

          with open(target, 'r') as f:
              content = f.read()

          if 'cmdline-tools' not in content:
              old = ('        sdkmanager_path = join(\n'
                     '            self.android_sdk_dir, \'tools\', \'bin\', sdk_manager_name)\n'
                     '        if not os.path.isfile(sdkmanager_path):\n'
                     '            raise BuildozerException(\n'
                     '                (\'sdkmanager path "{}" does not exist, sdkmanager is not\'\n'
                     '                 \' installed\'.format(sdkmanager_path)))')
              new = ('        sdkmanager_path = join(\n'
                     '            self.android_sdk_dir, \'cmdline-tools\', \'latest\', \'bin\', sdk_manager_name)\n'
                     '        if not os.path.isfile(sdkmanager_path):\n'
                     '            sdkmanager_path = join(\n'
                     '                self.android_sdk_dir, \'tools\', \'bin\', sdk_manager_name)\n'
                     '        if not os.path.isfile(sdkmanager_path):\n'
                     '            raise BuildozerException(\n'
                     '                (\'sdkmanager path "{}" does not exist, sdkmanager is not\'\n'
                     '                 \' installed\'.format(sdkmanager_path)))')
              content = content.replace(old, new)
              with open(target, 'w') as f:
                  f.write(content)
              print(f'Patch applied to {target}')
          else:
              print('Already patched')
          PYEOF

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$(dirname "$BUILDOZER_SDK")"
          if [ ! -L "$BUILDOZER_SDK" ]; then
            ln -s /usr/local/lib/android/sdk "$BUILDOZER_SDK"
          fi
          cd android
          buildozer android debug
        timeout-minutes: 120

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-converter-apk
          path: android/.buildozer/android/platform/build-*/bin/*.apk
          retention-days: 7