name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Accept Android SDK licenses (pre-installed SDK at /usr/local/lib/android/sdk)
        run: |
          SDK="/usr/local/lib/android/sdk"
          mkdir -p "$SDK/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$SDK/licenses/android-sdk-license"
          echo -e "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK/licenses/android-sdk-preview-license"
          echo -e "\n8933bad161af4178b1185d1a1f5b0d7f5f115065" > "$SDK/licenses/android-googletv-license"
          # Try to accept via both sdkmanager versions
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes 2>/dev/null | "$SDK/cmdline-tools/16.0/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 kivy==2.3.0 cython==0.29.37 pexpect==4.9.0
          pip install markitdown[all] beautifulsoup4 mammoth pdfminer.six pdfplumber
          pip install fpdf2 python-docx ebooklib chardet charset-normalizer defusedxml markdownify magika

      - name: Build debug APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          chmod -R 755 /usr/local/lib/android/sdk
          cd android
          buildozer android debug
        timeout-minutes: 60

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-converter-apk
          path: android/.buildozer/android/platform/build-*/bin/*.apk
          retention-days: 7