name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 kivy==2.3.0 cython==0.29.37 pexpect==4.9.0
          pip install markitdown[all] beautifulsoup4 mammoth pdfminer.six pdfplumber
          pip install fpdf2 python-docx ebooklib chardet charset-normalizer defusedxml markdownify magika

      - name: Build debug APK
        run: |
          cd android
          buildozer android debug
        timeout-minutes: 60

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-converter-apk
          path: android/.buildozer/android/platform/build-*/bin/*.apk
          retention-days: 7
